# Site settings
course_name: Machine Learning Bootcamp
course_description: "A comprehensive bootcamp covering machine learning fundamentals, algorithms, and applications."
course_semester: "2024"

baseurl: "/Machine-Learning-Bootcamp/website" # the subpath of your site
url: "https://nabin2004.github.io" # the base hostname & protocol for your site

schoolname: "Machine Learning Bootcamp"
