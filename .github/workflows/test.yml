name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Ruff
        run: |
          ruff check common bootcamp_manim scripts
          ruff format --check common bootcamp_manim scripts

      - name: nbmake (episode notebooks execute)
        run: pytest --nbmake ep00_bottom_up phase_1_classical_ml phase_2_deep_learning phase_3_scaling phase_4_capstones --ignore-glob='**/tests/**'
