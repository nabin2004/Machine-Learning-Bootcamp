[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-bootcamp"
version = "0.1.0"
description = "ML/DL bootcamp: four-act episodes, notebook parity, Manim, RISE"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["common", "bootcamp_manim", "bootcamp_manim.scenes"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["common", "bootcamp_manim", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "bootcamp_manim"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
norecursedirs = [".git", ".venv", "venv", "node_modules", "templates", "media"]
pythonpath = ["."]

[tool.nbmake]
# nbmake is invoked via pytest --nbmake; episode notebooks must execute cleanly.
